<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیست شهرها</title>
</head>
<body>
  <h1>لیست شهرها</h1>
  {% for item in cities %}
    <a href="{% url 'detail_city' item.id %}">
      <h2>{{ item.title }} ({{ item.lat }}, {{ item.lon }})</h2>
    </a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'delete_city' %}">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ item.id }}" />
        <input type="submit" value="حذف" />
      </form>
    {% endif %}
  {% endfor %}
  <hr />
  <a href="{% url 'add_city' %}">اضافه کردن شهر</a>
  <hr />
  {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <input type="submit" value="خروج" />
      </form>  
  {% else %}
      <a href="{% url 'login' %}">ورود به سایت  </a>
  {% endif %}
</body>
</html>
